
name: Generate PDF Cover

on:
  push:
    branches: [main]
    paths:
      - 'WataruHoeltermann_Proj1.pdf'
      - '.github/workflows/generate-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract first page
        run: |
          pdftoppm -f 1 -l 1 -singlefile \
            -png -scale-to 1200 \
            WataruHoeltermann_Proj1.pdf \
            presentation-cover

      - name: Commit cover image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add presentation-cover.png

          if ! git diff --cached --quiet; then
            git commit -m "Update PDF cover preview"
            git push
          fi
